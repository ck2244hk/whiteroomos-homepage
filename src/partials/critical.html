<script>
  (function () {
    try {
      var r = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (r || sessionStorage.getItem('wros-intro')) document.documentElement.classList.add('no-intro');
    } catch (e) {}
    // Hide the page until styles and fonts are ready (main.js removes the class); failsafe so it can never stay hidden.
    document.documentElement.classList.add('loading');
    setTimeout(function () { document.documentElement.classList.remove('loading'); }, 4000);
  })();
</script>
<style>
  /* Critical CSS: keeps the page from flashing unstyled (large blue logo) before the main stylesheet applies. */
  html, body { background: #FDFCFB; margin: 0; }
  a { color: inherit; }
  svg { max-width: 100%; }
  header.top .logo svg { height: 15px; width: auto; }
  #intro { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; align-content: center; gap: 22px; background: #FDFCFB; color: #1C1917; }
  #intro svg { width: min(62vw, 380px); height: auto; --stem: #A0724A; }
  #intro p { font: 500 11px/1 'JetBrains Mono', monospace; letter-spacing: .18em; text-transform: uppercase; color: #9A9490; margin: 0; }
  .no-intro #intro { display: none; }
  /* Loading screen: page content stays hidden until styles + fonts are ready. Only active when JS added .loading. */
  .loading body > :not(#loader):not(#intro):not(svg) { visibility: hidden; }
  #loader { display: none; position: fixed; inset: 0; z-index: 999; place-items: center; background: #FDFCFB; color: #1C1917; }
  .loading #loader { display: grid; animation: loaderIn .3s ease .2s both; }
  #loader svg { width: 64px; height: auto; --stem: #A0724A; animation: loaderPulse 1.2s ease-in-out infinite; }
  @keyframes loaderIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes loaderPulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  #intro { animation: introOut .55s ease 1.9s forwards; }
  #intro svg { animation: introMark 1.1s cubic-bezier(.65, 0, .25, 1) .15s both; }
  #intro p { animation: introFade .6s ease 1s both; }
  #intro.skip { animation: introOut .25s ease forwards; }
  @keyframes introMark { from { clip-path: inset(0 100% 0 0); opacity: .2; } to { clip-path: inset(0 0 0 0); opacity: 1; } }
  @keyframes introFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes introOut { to { opacity: 0; transform: translateY(-3%); visibility: hidden; pointer-events: none; } }
</style>
